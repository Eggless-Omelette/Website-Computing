<!DOCTYPE html>
<html lang="en">
<head>

<title>Access Denied</title>
<style>
    body {
        background: #fafafa;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 100px;
        color: #333;
    }

    .box {
        display: inline-block;
        padding: 40px 60px;
        border: 2px solid #000;
        background: white;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h1 {
        font-size: 32px;
        margin-bottom: 20px;
    }

    p {
        font-size: 20px;
        line-height: 1.5;
    }
</style>
</head>
<body>

<div class="box">
    <h1>ACCESS DENIED</h1>
    <p>
        We have detected severe levels of brokenness.<br>
        As a result, our products will not be displayed at this time.
    </p>
    <p style="margin-top: 25px; font-size: 14px; color: #777;">
        Please return when your wallet actually has money.
    </p>
</div>

</body>
</html>
