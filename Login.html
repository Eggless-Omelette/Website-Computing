<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Sign Up</title>
  <style>
    body.kenzie {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: url("Imagine_Dragons/balrshop (1).png") no-repeat center center fixed;
      background-size: cover;
      background-color: rgba(0,0,0,0.5);
      background-blend-mode: darken;
    }
    .yosef {
      background: rgba(255, 255, 255, 0.9);
      padding: 60px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      width: 600px;
      text-align: center;
    }
    .kiki {
      display: block;
      width: 95%;
      margin: 20px auto;
      padding: 16px;
      font-size: 18px;
    }
    .mryoganteng {
      font-size: 28px;
      margin-bottom: 30px;
    }
    .hls2026 {
      margin: 15px;
      padding: 16px 32px;
      cursor: pointer;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      background-color: #D4AF37;
      color: white;
    }
    .hls2026:hover {
      background-color: #D4AF37;
    }
    #handong {
      display: none;
    }
  </style>
</head>
<body class="kenzie">
  <div class="yosef">
    <h2 id="mryoganteng">Login</h2>
    <input type="email" id="welovegac-email" class="kiki" placeholder="Email" required>
    <input type="password" id="welovegac-password" class="kiki" placeholder="Password" required>
    <input type="date" id="handong" class="kiki" placeholder="Birthday">
    <button id="welovegac-toggle" class="hls2026">Switch to Sign Up</button>
    <button id="welovegac-enter" class="hls2026">Enter</button>
  </div>

<script>
  const toggleBtn = document.getElementById('welovegac-toggle');
  const enterBtn = document.getElementById('welovegac-enter');
  const birthdayInput = document.getElementById('handong');
  const formTitle = document.getElementById('mryoganteng');

  let isLogin = true;

  toggleBtn.addEventListener('click', () => {
    isLogin = !isLogin;
    if (isLogin) {
      formTitle.textContent = "Login";
      birthdayInput.style.display = "none";
      toggleBtn.textContent = "Switch to Sign Up";
    } else {
      formTitle.textContent = "Sign Up";
      birthdayInput.style.display = "block";
      toggleBtn.textContent = "Switch to Login";
    }
  });

  enterBtn.addEventListener('click', () => {
    const email = document.getElementById('welovegac-email').value;
    const password = document.getElementById('welovegac-password').value;

    document.getElementById('welovegac-email').value = "";
    document.getElementById('welovegac-password').value = "";
    birthdayInput.value = "";

    if (isLogin) {
      if (email === "Hezki.Ganteng@teachindonesia-school.com" && password === "6663629") {
        window.location.href = "Admin.html";
      } else {
        window.location.href = "Outstock.html";
      }
    } else {
      window.location.href = "Wait.html"; 
    }
  });
</script>

</body>
</html>
